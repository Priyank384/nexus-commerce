name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_DATABASE: nexuscommerce
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Assemble (compile + jar)
        run: ./gradlew --no-daemon assemble

      - name: Unit tests
        # The default test profile uses H2 in-memory; no service container needed.
        run: ./gradlew --no-daemon test

      - name: Flyway validate against MySQL service
        # Proves every applied migration matches on a real MySQL, the JPA entities
        # still validate against the resulting schema (ddl-auto=validate), and the
        # app boots end-to-end with Redis reachable.
        env:
          username: root
          password: ""
          PORT: "3001"
          redis_port: "6379"
          JWT_SECRET: ci-only-secret-please-rotate-in-real-deployment-0123456789
        run: |
          ./gradlew --no-daemon bootRun > bootrun.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 60); do
            if ! kill -0 $pid 2>/dev/null; then
              echo "bootRun process died early:"; cat bootrun.log; exit 1
            fi
            if curl -sf http://localhost:3001/actuator/health > /tmp/health.json; then
              cat /tmp/health.json; echo; ok=1; break
            fi
            sleep 2
          done
          kill $pid 2>/dev/null || true
          wait $pid 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "bootRun did not become healthy in time:"; cat bootrun.log; exit 1
          fi
          echo "--- bootRun log tail ---"; tail -80 bootrun.log
