version: '3.8'
services:
  elasticsearch:
    image: elasticsearch:8.17.1
    container_name: elasticsearch
    restart: always
    ports:
      - 9200:9200
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/elasticsearch_data
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    networks:
      - elk-network
  
  kibana:
    image: kibana:8.17.1
    container_name: kibana
    restart: always
    ports:
      - 5601:5601
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - elk-network

  logstash:
    image: logstash:8.17.1
    container_name: logstash
    restart: always
    ports:
      - 5044:5044
    environment:
      - -LS_JAVA_OPTS=-Xms256m -Xmx256m
    depends_on:
      - elasticsearch
    networks:
      - elk-network
    volumes:
      - ./logstash/:/logstash_dir
      - logstash_data:/usr/share/logstash/data
    command: logstash -f /logstash_dir/pipeline/logstash.conf

  # The response cache needs Redis. Values come from the same .env the app reads,
  # so redis_port stays consistent between the two.
  redis:
    image: redis:7.4-alpine
    container_name: nexus-redis
    restart: always
    ports:
      - "${redis_port:-6379}:6379"
    # Cache entries all have a TTL, so evicting least-recently-used keys is safe here
    # and keeps the container bounded instead of growing until Redis starts erroring.
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - elk-network

  # Only for a fully containerised setup: application.yml currently points at the
  # MySQL already running on localhost:3306, so leave this scaled down to avoid a
  # port clash. Use `docker compose up mysql` if you want to switch to it.
  mysql:
    image: mysql:9.6
    container_name: nexus-mysql
    profiles: ["local-db"]
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${password}
      MYSQL_DATABASE: nexuscommerce
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - elk-network

volumes:
  elasticsearch_data: {}
  logstash_data: {}
  redis_data: {}
  mysql_data: {}
networks:
  elk-network:
    driver: bridge