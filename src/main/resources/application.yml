spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: NexusCommerce
  datasource:
    # Every value below keeps the historical local-MySQL setup as its default, so booting
    # without a DB_* override is byte-identical to before. Pointing at PostgreSQL (Aiven)
    # is a .env change only: DB_URL, DB_USER, DB_PASSWORD, DB_DRIVER, FLYWAY_LOCATIONS.
    url: ${DB_URL:jdbc:mysql://localhost:3306/nexuscommerce?useServerPrepStmts=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&rewriteBatchedStatements=true}
    username: ${DB_USER:${username}}
    password: ${DB_PASSWORD:${password}}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      # Default of 10 was saturating under concurrent cached requests, and a longer
      # checkout wait turns saturation into visible latency spikes.
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      pool-name: nexus-pool
  jpa:
    # Requests must not hold a connection (and therefore a transaction) open while the
    # response is serialised. Associations reached outside a service method have to be
    # fetched explicitly; the paged endpoints do that already.
    open-in-view: false
    # show-sql writes every statement through a synchronized System.out; keep it off
    # outside local debugging and use the org.hibernate.SQL logger instead.
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        # Default 2000 keeps large joins inside one JDBC round trip instead of
        # chunking row reads.
        jdbc.fetch_size: 2000
  flyway:
    enabled: true
    # db/migration is MySQL, db/migration-postgres is the parallel PostgreSQL set.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  lifecycle:
    timeout-per-shutdown-phase: 30s
  data:
    redis:
      host: localhost
      port: ${redis_port}
      # Without these a Redis that accepts the socket but stops answering holds a request
      # thread for the Lettuce default (60s). The CacheErrorHandler covers failures, not
      # hangs, so the deadline has to be explicit.
      connect-timeout: 500ms
      timeout: 500ms
server:
  port: ${PORT}
  # Let in-flight requests finish on SIGTERM before the JVM exits; combined with the
  # liveness/readiness probes under management.endpoint.health this is what makes a
  # rolling restart safe.
  shutdown: graceful
  compression:
    enabled: true
    # Small JSON responses compress slower than they save; only bother above ~2 KB.
    min-response-size: 2048
    mime-types: application/json

management:
  endpoints:
    web:
      exposure:
        # Only these are HTTP-reachable; /actuator/shutdown and /env stay off the wire.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

app:
  jwt:
    # Override with a real secret (>= 32 bytes) via env in any non-dev deployment; the
    # default below is a fixed dev-only value so the app boots without a secret file.
    secret: ${JWT_SECRET:nexuscommerce-dev-only-secret-key-change-me-in-production-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
  upload:
    # Local filesystem directory the multipart image endpoint stores files under.
    # Swap to S3 (or similar) by replacing the storage bean, or mount a volume here in Docker.
    dir: ${UPLOAD_DIR:uploads/products}
  rate-limit:
    login:
      max: ${LOGIN_RATE_MAX:10}
      window-seconds: ${LOGIN_RATE_WINDOW_SECONDS:60}

razorpay:
  # Empty defaults keep the app bootable (and the test suite green) without credentials; the
  # payment endpoints answer 502 with an actionable message until they are supplied.
  # Values come from .env: RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET.
  base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com/v1}
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  # Must match the secret entered in the Razorpay dashboard for this webhook endpoint.
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  currency: ${RAZORPAY_CURRENCY:INR}

springdoc:
  swagger-ui:
    # Deterministic, tidy layout in the UI: alphabetical tag groups and operations.
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
