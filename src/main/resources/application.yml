spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: NexusCommerce
  datasource:
    url: jdbc:mysql://localhost:3306/nexuscommerce?useServerPrepStmts=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&rewriteBatchedStatements=true
    username: ${username}
    password: ${password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Default of 10 was saturating under concurrent cached requests, and a longer
      # checkout wait turns saturation into visible latency spikes.
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      pool-name: nexus-pool
  jpa:
    # Requests must not hold a connection (and therefore a transaction) open while the
    # response is serialised. Associations reached outside a service method have to be
    # fetched explicitly; the paged endpoints do that already.
    open-in-view: false
    # show-sql writes every statement through a synchronized System.out; keep it off
    # outside local debugging and use the org.hibernate.SQL logger instead.
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        # Default 2000 keeps large joins inside one JDBC round trip instead of
        # chunking row reads.
        jdbc.fetch_size: 2000
  flyway:
    enabled: true
    locations: classpath:db/migration 
  profiles:
    active: dev
  data:
    redis:
      host: localhost
      port: ${redis_port}
      # Without these a Redis that accepts the socket but stops answering holds a request
      # thread for the Lettuce default (60s). The CacheErrorHandler covers failures, not
      # hangs, so the deadline has to be explicit.
      connect-timeout: 500ms
      timeout: 500ms
server:
  port: ${PORT}
  # Let in-flight requests finish on SIGTERM before the JVM exits; combined with the
  # liveness/readiness probes under management.endpoint.health this is what makes a
  # rolling restart safe.
  shutdown: graceful
  compression:
    enabled: true
    # Small JSON responses compress slower than they save; only bother above ~2 KB.
    min-response-size: 2048
    mime-types: application/json

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        # Only these are HTTP-reachable; /actuator/shutdown and /env stay off the wire.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

app:
  jwt:
    # Override with a real secret (>= 32 bytes) via env in any non-dev deployment; the
    # default below is a fixed dev-only value so the app boots without a secret file.
    secret: ${JWT_SECRET:nexuscommerce-dev-only-secret-key-change-me-in-production-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

springdoc:
  swagger-ui:
    # Deterministic, tidy layout in the UI: alphabetical tag groups and operations.
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
