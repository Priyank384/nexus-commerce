spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: NexusCommerce
  datasource:
    # Every value below keeps the historical local-MySQL setup as its default, so booting
    # without a DB_* override is byte-identical to before. Pointing at PostgreSQL (Supabase)
    # is a .env change only: DB_URL, DB_USER, DB_PASSWORD, DB_DRIVER, FLYWAY_LOCATIONS.
    url: ${DB_URL:jdbc:mysql://localhost:3306/nexuscommerce?useServerPrepStmts=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&rewriteBatchedStatements=true}
    username: ${DB_USER:${username}}
    password: ${DB_PASSWORD:${password}}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      # Default of 10 was saturating under concurrent cached requests, and a longer
      # checkout wait turns saturation into visible latency spikes.
      # Managed free-tier databases cap total connections, so the pool size is
      # overridable — leave headroom for Flyway and psql sessions.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      # Poolers (Supavisor, PgBouncer) drop sessions that sit idle. Parking the default
      # five idle connections just produces "This connection has been closed" churn and
      # can wedge a long migration, so idle count is tunable and defaults low.
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: 3000
      keepalive-time: 30000
      # Below the typical pooler idle timeout, so connections are recycled by us first.
      max-lifetime: 300000
      pool-name: nexus-pool
  jpa:
    # Requests must not hold a connection (and therefore a transaction) open while the
    # response is serialised. Associations reached outside a service method have to be
    # fetched explicitly; the paged endpoints do that already.
    open-in-view: false
    # show-sql writes every statement through a synchronized System.out; keep it off
    # outside local debugging and use the org.hibernate.SQL logger instead.
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
        # Default 2000 keeps large joins inside one JDBC round trip instead of
        # chunking row reads.
        jdbc.fetch_size: 2000
  flyway:
    enabled: true
    # db/migration is MySQL, db/migration-postgres is the parallel PostgreSQL set.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  lifecycle:
    timeout-per-shutdown-phase: 30s
  data:
    redis:
      # Local development points at the Homebrew Redis (redis_port in .env). Managed
      # providers (Upstash) hand out a single rediss:// URL — set REDIS_URL and it wins
      # over the parts below; the host/port/SSL trio stays for providers that don't.
      url: ${REDIS_URL:}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:${redis_port:6379}}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      # Without these a Redis that accepts the socket but stops answering holds a request
      # thread for the Lettuce default (60s). The CacheErrorHandler covers failures, not
      # hangs, so the deadline has to be explicit. Connect gets a looser budget because a
      # managed TLS endpoint needs a handshake on every cold connection.
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      # Lettuce applies this same deadline to connection initialisation (TLS handshake
      # included), not just to commands. A managed Redis on another continent needs
      # more than the local-dev 500ms, so it is overridable.
      timeout: ${REDIS_TIMEOUT:500ms}
server:
  port: ${PORT}
  # Let in-flight requests finish on SIGTERM before the JVM exits; combined with the
  # liveness/readiness probes under management.endpoint.health this is what makes a
  # rolling restart safe.
  shutdown: graceful
  compression:
    enabled: true
    # Small JSON responses compress slower than they save; only bother above ~2 KB.
    min-response-size: 2048
    mime-types: application/json

management:
  endpoints:
    web:
      exposure:
        # Only these are HTTP-reachable; /actuator/shutdown and /env stay off the wire.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

app:
  flyway:
    # Local convenience: repair the history before migrating so a half-applied seed does
    # not wedge the schema. Off unless FLYWAY_REPAIR=true; the prod profile forces it off.
    repair: ${FLYWAY_REPAIR:false}
  cors:
    # Comma-separated browser origins allowed to call the API directly. The storefront is a
    # BFF (the browser only talks to Next), so this guards direct calls rather than the app.
    # :3001 is here because Swagger UI posts from the API's own origin.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  storage:
    # local (default) writes under app.upload.dir; s3 talks to any S3-compatible store,
    # including Supabase Storage. Both return an absolute or /uploads-relative public URL.
    type: ${STORAGE_TYPE:local}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:auto}
      bucket: ${S3_BUCKET:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      # Public base URL the bucket is served from (the Supabase public-object URL or a custom host).
      public-base-url: ${S3_PUBLIC_BASE_URL:}
      key-prefix: ${S3_KEY_PREFIX:products}
  jwt:
    # Override with a real secret (>= 32 bytes) via env in any non-dev deployment; the
    # default below is a fixed dev-only value so the app boots without a secret file.
    secret: ${JWT_SECRET:nexuscommerce-dev-only-secret-key-change-me-in-production-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
  upload:
    # Local filesystem directory the multipart image endpoint stores files under.
    # Swap to S3 (or similar) by replacing the storage bean, or mount a volume here in Docker.
    dir: ${UPLOAD_DIR:uploads/products}
  rate-limit:
    login:
      max: ${LOGIN_RATE_MAX:10}
      window-seconds: ${LOGIN_RATE_WINDOW_SECONDS:60}
  admin:
    bootstrap:
      # Dev/test only. Empty by default, which makes AdminBootstrap inert. Setting both creates
      # (or promotes) that email to ROLE_ADMIN with this password on every boot so the admin
      # surface can be exercised. Never populate these in a real deployment.
      email: ${ADMIN_BOOTSTRAP_EMAIL:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
      name: ${ADMIN_BOOTSTRAP_NAME:Platform Admin}

razorpay:
  # Empty defaults keep the app bootable (and the test suite green) without credentials; the
  # payment endpoints answer 502 with an actionable message until they are supplied.
  # Values come from .env: RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET.
  base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com/v1}
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  # Must match the secret entered in the Razorpay dashboard for this webhook endpoint.
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  currency: ${RAZORPAY_CURRENCY:INR}

springdoc:
  swagger-ui:
    # Deterministic, tidy layout in the UI: alphabetical tag groups and operations.
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
